name: First Go API

on:
  workflow_dispatch:
  push:
    branches: [fix/workflow]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: "Build Docker Image"
        run: |
          docker build -t first-go-api:latest -f docker/go.Dockerfile .

