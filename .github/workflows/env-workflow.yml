name: First Go API

on:
  workflow_dispatch:
  push:
    branches: [fix/workflow]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Docker tag
        run: echo "DOCKER_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t first-go-api:${DOCKER_TAG} -f docker/go.Dockerfile .
          docker save first-go-api:${DOCKER_TAG} -o first-go-api.tar

      # - name: "Build Docker Image"
      #   run: |
      #     docker build -t first-go-api:latest -f docker/go.Dockerfile .
      #     docker save first-go-api:latest -o first-go-api.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-go-api
          path: first-go-api.tar


  deploy:
    needs: build
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: first-go-api

      - name: Load Docker Image
        run: docker load -i first-go-api.tar

      - name: List Docker images
        run: docker image ls

      - name: Create .prod.env file from secrets
        run: echo "${{ secrets.PROD_ENV }}" > .prod.env

      - name: Remove old container if exists
        run: |
          docker rm -f first_go_api_prod || true

      - name: Build and Run Production App with Docker Compose
        run: |
          echo $(pwd)
          docker compose -f docker-compose.yml up -d --build app

